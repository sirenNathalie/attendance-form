<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendance Form</title>

    <link rel="manifest" href="manifest.json">

    <!-- iPhone icon -->
    <link rel="apple-touch-icon" href="logo.png">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: white;
        }

        .container {
            text-align: center;
            padding: 30px;
        }

        img {
            width: 180px;
            height: 180px;
            object-fit: contain;
        }

        h1 {
            margin-top: 20px;
        }

        button {
            margin-top: 20px;
            padding: 15px 35px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <img src="logo.png" alt="Logo">

    <h1>Attendance Form</h1>

    <button onclick="openForm()">
        Open Attendance Form
    </button>

</div>

<script>

function openForm() {

    window.location.href = "https://docs.google.com/forms/d/e/1FAIpQLSfSBQPhwsme_9XUkNTLyvymSxsi1ibYlZ01rGiSshz0I4MMTg/viewform?usp=header";

}

</html>
